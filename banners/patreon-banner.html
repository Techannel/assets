<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Patreon banner</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a0508; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="400"></canvas>
<script>
// Techannel Patreon banner for the top of every Civitai card (owner 2026-10-30: "a little banner for the patreon that goes on top of
// every description", replacing the 🔓 Early access text line; "also write new loras for free 7 days early"; "do not add images from
// our loras"; v2: "it's kinda confusing and make it more on the red spectrum" → ONE message left, ONE button right, reds only).
// v3 (owner 2026-11-12: the 7-day free trial is on, "remake the banner how you want"): the offer is the whole early-access set, free for a
// week; the button starts the trial; the price sits under it.
// Rendered to PNG by headless Chrome. Civitai shows it ~800 px wide, so text is sized for half scale.
const W = 1600, H = 400;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };

function background() {
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#1c0508'); bg.addColorStop(0.5, '#4a0b14'); bg.addColorStop(1, '#8e1424');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const glow = (x, y, r, c) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H); };
  glow(1290, 200, 460, 'rgba(255,80,80,0.30)');
  glow(120, 40, 360, 'rgba(255,140,110,0.10)');
  let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;   // a few soft sparkles
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,220,210,${0.12 + rnd() * 0.35})`; g.beginPath(); g.arc(rnd() * W, rnd() * H, rnd() * 1.6 + 0.4, 0, 7); g.fill(); }
}

function lock(x, y, color) {                                               // small open padlock
  g.save(); g.translate(x, y); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 3;
  g.beginPath(); g.arc(9, 9, 6.5, Math.PI, Math.PI * 1.95); g.stroke();
  rr(0, 9, 18, 14, 3); g.fill(); g.restore();
}

function message() {
  const X = 80;
  g.font = '800 22px Inter'; const tag = 'EARLY ACCESS', tw = g.measureText(tag).width + 64;
  rr(X, 58, tw, 40, 20); g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,200,190,0.45)'; g.stroke();
  lock(X + 18, 66, '#ffd2c4'); g.fillStyle = '#ffe3da'; g.fillText(tag, X + 46, 86);
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 14; g.shadowOffsetY = 4;
  g.font = '800 70px Inter'; g.fillStyle = '#ffffff'; g.fillText('All early-access LoRAs', X, 182);
  const warm = g.createLinearGradient(X, 0, X + 470, 0); warm.addColorStop(0, '#ff7a6b'); warm.addColorStop(1, '#ffc58a');
  g.fillStyle = warm; g.fillText('free for 7 days', X, 258);
  g.font = '700 30px "Noto Sans CJK JP"'; g.fillStyle = '#ffd9d0'; g.fillText('早期アクセスのLoRAすべて、7日間無料でお試し', X, 322);
  g.shadowColor = 'transparent';
}

function action() {
  const cx = 1290;
  g.save();
  g.font = '800 40px Inter'; const label = 'Start free trial', bw = g.measureText(label).width + 160, bx = cx - bw / 2, by = 150;
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
  rr(bx, by, bw, 92, 46); g.fillStyle = '#ffffff'; g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = '#c3172e'; g.textAlign = 'center'; g.fillText(label, cx - 28, by + 60);
  g.lineWidth = 5; g.lineCap = 'round'; g.strokeStyle = '#c3172e';             // arrow
  const ax = cx + bw / 2 - 52, ay = by + 46;
  g.beginPath(); g.moveTo(ax - 16, ay); g.lineTo(ax + 12, ay); g.moveTo(ax + 1, ay - 11); g.lineTo(ax + 12, ay); g.lineTo(ax + 1, ay + 11); g.stroke();
  g.font = '700 26px Inter'; g.fillStyle = '#ffe3da'; g.fillText('then €5/month · cancel anytime', cx, by + 142);
  g.font = '600 20px Inter'; g.fillStyle = 'rgba(255,220,210,0.7)'; g.fillText('patreon.com/cw/Techannel', cx, by + 174);
  g.restore();
}

(async () => {
  await Promise.all([document.fonts.load('800 70px Inter'), document.fonts.load('600 20px Inter'), document.fonts.load('700 30px "Noto Sans CJK JP"', '早期')]);
  background(); message(); action();
  document.title = 'READY';
})();
</script>
</body>
</html>
